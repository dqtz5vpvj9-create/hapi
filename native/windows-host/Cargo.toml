[package]
name = "hapi-windows-host"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }

[features]
test-fixture = []

[[bin]]
name = "hapi-host-fixture"
path = "tests/support/fixture.rs"
required-features = ["test-fixture"]

[target.'cfg(windows)'.dependencies]
futures-util = { version = "0.3", features = ["sink"] }
socket2 = "0.6"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time", "sync"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
    "Win32_Storage_FileSystem", "Win32_System_Environment", "Win32_System_JobObjects",
    "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Threading",
    "Win32_System_WindowsProgramming", "Win32_UI_WindowsAndMessaging", "Win32_System_StationsAndDesktops",
    "Win32_System_RemoteDesktop", "Win32_Graphics_Gdi", "Win32_System_SystemServices",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
