name: capacitor-mobile

on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - 'mobile/**'
            - 'shared/src/**'
            - 'patches/**'
            - 'package.json'
            - 'bun.lock'
            - 'scripts/testing/check-web-budget.mjs'
            - '.github/workflows/capacitor-mobile.yml'
    pull_request:
        paths:
            - 'mobile/**'
            - 'shared/src/**'
            - 'patches/**'
            - 'package.json'
            - 'bun.lock'
            - 'scripts/testing/check-web-budget.mjs'
            - '.github/workflows/capacitor-mobile.yml'

permissions:
    contents: read

concurrency:
    group: capacitor-mobile-${{ github.ref }}
    cancel-in-progress: true

jobs:
    android:
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '21'
            - uses: gradle/actions/setup-gradle@v4
            - run: bun install --frozen-lockfile
            - name: Test native bundle packaging guard
              run: bun run --cwd mobile test
            - name: Sync the hosted website shell and native plugins
              run: bun run build:mobile
            - name: Verify native dependency declarations are current
              run: git diff --exit-code -- mobile
            - name: Restore persistent Android signing key
              if: github.event_name != 'pull_request'
              env:
                  KEYSTORE_BASE64: ${{ secrets.HAPI_ANDROID_KEYSTORE_BASE64 }}
              run: |
                  test -n "$KEYSTORE_BASE64" || { echo 'HAPI_ANDROID_KEYSTORE_BASE64 is required to publish an APK'; exit 1; }
                  umask 077
                  printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hapi-android.keystore"
                  printf 'HAPI_ANDROID_KEYSTORE_PATH=%s\n' "$RUNNER_TEMP/hapi-android.keystore" >> "$GITHUB_ENV"
            # Pull requests compile without access to the persistent key and
            # do not publish an installable APK with a different signer.
            - name: Assemble debug APK and lint
              working-directory: mobile/android
              run: ./gradlew :app:assembleDebug :app:lintDebug
            - name: Verify published APK uses the persistent certificate
              if: github.event_name != 'pull_request'
              run: |
                  apksigner="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
                  "$apksigner" verify --print-certs-pem mobile/android/app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/hapi-apk-cert.txt"
                  python3 - "$RUNNER_TEMP/hapi-apk-cert.txt" mobile/android-signing-cert.pem <<'PY'
                  import re, sys
                  from pathlib import Path
                  def certificates(path):
                      return [''.join(value.split()) for value in re.findall(
                          r'-----BEGIN CERTIFICATE-----(.*?)-----END CERTIFICATE-----',
                          Path(path).read_text(), re.S)]
                  actual, expected = map(certificates, sys.argv[1:])
                  if not expected or actual != expected:
                      raise SystemExit('APK certificate differs from the established local signing key')
                  print('APK signature matches the established local signing certificate')
                  PY
            - name: Upload debug APK
              if: github.event_name != 'pull_request'
              uses: actions/upload-artifact@v4
              with:
                  name: hapi-capacitor-android-debug
                  path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
                  if-no-files-found: error
                  retention-days: 7
            - name: Remove restored signing key
              if: always() && github.event_name != 'pull_request'
              run: rm -f "${RUNNER_TEMP:?}/hapi-android.keystore"

    ios:
        runs-on: macos-26
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json
            - run: bun install --frozen-lockfile
            - name: Show Xcode toolchain
              run: xcodebuild -version
            - name: Sync the hosted website shell and native plugins
              run: bun run build:mobile
            - name: Verify native dependency declarations are current
              run: git diff --exit-code -- mobile
            - name: Build unsigned iOS Simulator app
              run: >-
                  xcodebuild build
                  -project mobile/ios/App/App.xcodeproj
                  -scheme App
                  -destination 'generic/platform=iOS Simulator'
                  CODE_SIGNING_ALLOWED=NO
